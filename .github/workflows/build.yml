name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            display: Windows
          - os: ubuntu-latest
            display: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm

      - name: Build with PyInstaller (Linux, Docker ubuntu:18.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              apt-get install -y -qq curl fontconfig binutils \
                libxcb-cursor0 libxkbcommon-x11-0 libegl1-mesa
              apt-get install -y -qq upx-ucl 2>/dev/null || true

              curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/conda
              /opt/conda/bin/conda install -y python=3.12 pyqt
              /opt/conda/bin/python -m pip install -q pyinstaller numpy

              /opt/conda/bin/python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm
            "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasteLabel-${{ matrix.display }}
          path: dist/PasteLabel*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts for upload
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p staging
          if [ -f artifacts/PasteLabel-Windows/PasteLabel.exe ]; then
            cp artifacts/PasteLabel-Windows/PasteLabel.exe "staging/PasteLabel-${TAG}-Windows.exe"
          fi
          if [ -f artifacts/PasteLabel-Linux/PasteLabel ]; then
            file artifacts/PasteLabel-Linux/PasteLabel
            cp artifacts/PasteLabel-Linux/PasteLabel "staging/PasteLabel-${TAG}-Linux"
            chmod +x "staging/PasteLabel-${TAG}-Linux"
            file "staging/PasteLabel-${TAG}-Linux"
          fi

      - name: Create or upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          printf '%s\n' \
            "PasteLabel $TAG — 新增分割多边形、姿态关键点、旋转框（OBB）三种标注模式" \
            "" \
            "✨ 新增" \
            "• 分割多边形标注（P）：逐点勾勒目标轮廓，双击 / Enter / 右键完成，支持顶点拖动、边上左键插入、顶点右键删除（至少 3 点）" \
            "• 姿态关键点标注（K）：单击放置关键点，配合分组组成姿态实例" \
            "• 旋转框标注（OBB，O）：拖拽创建水平框后，拖旋转手柄或按 Z / X 调整角度，标签名旁显示当前角度" \
            "• 分组标注：任意形状可分配分组号，标签列表显示为「标签名 [分组号]」，背景图列表支持按任务、按分组筛选" \
            "• 旋转框右键菜单：重置旋转 / 转为 HBB；水平框可转为 OBB" \
            "" \
            "🔧 改进" \
            "• 多任务导出：YOLO 下拉支持 Detection / Seg / Pose / OBB 四种任务，并新增对应行格式；导出前按任务校验，混合形状给出跳过提示或报错，避免静默生成空标签" \
            "• 格式转换：新增「任务类型」选项（检测框 / 分割 / 旋转框 / 关键点），决定 YOLO 行格式；LabelMe 读写改为无损，保留形状类型、顶点与分组" \
            "• 数据增强：翻转、旋转、缩放、平移同步变换并保留形状类型、顶点与分组，增强后 JSON 完整保真" \
            "• 统计窗口：背景图标签表新增「框类型」列" \
            "• 旋转角度步长可在设置中调节（1~6°，默认 1°）" \
            "• 处理面板「增强划分」中的导出按钮改为直接导出，不再弹出多余的任务选择菜单" \
            "" \
            "🐛 修复" \
            "• 修复增强后导出 YOLO Seg / OBB / Pose 时因形状信息被拍平而生成空标签文件的问题" \
            "• 修复选项菜单首项「显示BOX」无法切换的问题" \
            > release-notes.md

          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "PasteLabel $TAG" \
            --notes-file release-notes.md
          for f in staging/*; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
