name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt5 pytest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            display: Windows
          - os: ubuntu-latest
            display: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install PyQt5 pyinstaller Pillow

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm

      - name: Build with PyInstaller (Linux, Docker ubuntu:18.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              apt-get install -y -qq curl fontconfig binutils \
                libxcb-cursor0 libxkbcommon-x11-0 libegl1-mesa
              apt-get install -y -qq upx-ucl 2>/dev/null || true

              curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/conda
              /opt/conda/bin/conda install -y python=3.12 pyqt
              /opt/conda/bin/python -m pip install -q pyinstaller pillow

              /opt/conda/bin/python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm
            "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasteLabel-${{ matrix.display }}
          path: dist/PasteLabel*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts for upload
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p staging
          if [ -f artifacts/PasteLabel-Windows/PasteLabel.exe ]; then
            cp artifacts/PasteLabel-Windows/PasteLabel.exe "staging/PasteLabel-${TAG}-Windows.exe"
          fi
          if [ -f artifacts/PasteLabel-Linux/PasteLabel ]; then
            file artifacts/PasteLabel-Linux/PasteLabel
            cp artifacts/PasteLabel-Linux/PasteLabel "staging/PasteLabel-${TAG}-Linux"
            chmod +x "staging/PasteLabel-${TAG}-Linux"
            file "staging/PasteLabel-${TAG}-Linux"
          fi

      - name: Create or upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          printf '%s\n' \
            "PasteLabel v1.1.1 — 后台扫描与颜色持久化" \
            "" \
            "🆕 新功能" \
            "• 背景导入 JSON 标签扫描移至后台线程（DatasetLabelScanWorker），不再阻塞 UI" \
            "• 30 个不同默认标签颜色 + 按标签名持久化的 label_color_map，重启不丢失" \
            "• 标签统计编辑器颜色选择后自动写入 color_map 并持久化" \
            "• 扫描期间手动新增的类别不会被扫描结果覆盖（改用 update 合并）" \
            "• 大数据集首图立即显示，后续图片分批定时加载（50 张/30ms），UI 不卡顿" \
            "• 标签统计弹窗支持表格折叠/展开（▼/▶ 按钮在标题左侧）" \
            "• 统计弹窗全量扫描所有 JSON 文件，显示完整数据集标签数" \
            "" \
            "🐛 修复" \
            "• 背景导入不再显示『识别中』遮罩和冻结背景列表，首图与列表项立即可见" \
            "• 重新导入背景数据集不再等待旧扫描线程（generation + 路径快照拦截旧结果）" \
            "• 重导入时可见的处理面板立即清空旧类别并显示当前扫描状态" \
            "• 关闭窗口有界等待所有扫描线程（2s），拒绝退出而非野蛮销毁" \
            "• 数据处理面板『识别中』卡死：Worker 崩溃时 try/except 兜底，pending 必归 False" \
            "• 数据处理面板『识别中』不刷新：800ms 定时轮询，扫描完成后自动显示标签" \
            "• 记忆记录不保存：closeEvent 补全 _save_memory_record_on_close()" \
            "• 标注模式不再创建 _paste_output 目录，JSON 保存在原图同目录" \
            "• 贴图模式无贴图时不保存 JSON（按模式守卫）" \
            "• 标注模式默认勾选 auto_save_B，贴图模式默认勾选 auto_save_P" \
            "• 切图空数据时不再创建 _paste_output 目录" \
            "• 标签统计弹窗未导入 QWidget 导致崩溃" \
            "" \
            "⚙️ 代码" \
            "• 新增 DatasetLabelScanWorker(QThread) 及 generation/path 过期检测" \
            "• 新增 test_background_label_scan.py（17 tests）" \
            "• 新增 test_label_color_map_regressions.py（颜色持久化回归）" \
            "• 旧 16 色 palette 自动扩展到 30 色，兼容已有配置" \
            "• 覆盖所有文本文件的 .gitattributes eol=lf" \
            "• 扫描函数改为 ThreadPoolExecutor(8) 并行读 JSON" \
            "• 扫描最多前 500 个文件，秒级出结果" \
            "• 数据处理面板新增 _fast_labels() 从 detection_boxes_dict 快速获取已有标签" \
            > release-notes.md

          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "PasteLabel $TAG" \
            --notes-file release-notes.md
          for f in staging/*; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
