name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt5 pytest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            display: Windows
          - os: ubuntu-latest
            display: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install PyQt5 pyinstaller Pillow

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm

      - name: Build with PyInstaller (Linux, Docker ubuntu:18.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              apt-get install -y -qq curl fontconfig binutils \
                libxcb-cursor0 libxkbcommon-x11-0 libegl1-mesa
              apt-get install -y -qq upx-ucl 2>/dev/null || true

              curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/conda
              /opt/conda/bin/conda install -y python=3.12 pyqt
              /opt/conda/bin/python -m pip install -q pyinstaller pillow

              /opt/conda/bin/python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm
            "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasteLabel-${{ matrix.display }}
          path: dist/PasteLabel*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts for upload
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p staging
          if [ -f artifacts/PasteLabel-Windows/PasteLabel.exe ]; then
            cp artifacts/PasteLabel-Windows/PasteLabel.exe "staging/PasteLabel-${TAG}-Windows.exe"
          fi
          if [ -f artifacts/PasteLabel-Linux/PasteLabel ]; then
            file artifacts/PasteLabel-Linux/PasteLabel
            cp artifacts/PasteLabel-Linux/PasteLabel "staging/PasteLabel-${TAG}-Linux"
            chmod +x "staging/PasteLabel-${TAG}-Linux"
            file "staging/PasteLabel-${TAG}-Linux"
          fi

      - name: Create or upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          printf '%s\n' \
            "PasteLabel v1.1.0 — 数据处理与导出" \
            "" \
            "🆕 新功能" \
            "• 数据处理面板（浮动窗口），通过工具栏「导出」按钮打开" \
            "• 数据增强：12 种图像变换（水平翻转、垂直翻转、亮度、对比度、色相、饱和度、明度、高斯噪声、椒盐噪声、随机平移、随机旋转、随机缩放），可配置参数范围，支持全部增强和随机几项模式，可调图片比例" \
            "• YOLO 导出：LabelMe JSON → YOLO 格式（images/ + labels/ + classes.txt），支持选择导出标签类别、跳过空标签、自动检测增强后图片" \
            "• 数据集划分：按 train/val/test 比例自动划分到 divide/ 目录，默认 0.8/0.1/0.1，比例自动约束" \
            "• 一键流水线：增强→导出→划分串联执行，支持整体中断" \
            "• 每个步骤支持中断（■）和清空输出文件" \
            "• 画布加载动画，加载大量图片时显示旋转字符" \
            "" \
            "🐛 修复" \
            "• 放大器改用屏幕坐标，center 模式不调位不 clamp" \
            "• 绘制模式下禁止贴图与检测框进入编辑态" \
            "" \
            "📖 文档" \
            "• 用户指南重写，数据处理作为独立章节" \
            "• 新增「设置说明」文档，包含快捷键与参数完整列表" \
            "• README 新增数据处理截图、文档导航更新" \
            "• 项目结构文档同步更新" \
            "• 中英文国际化新增数据处理相关文案" \
            "" \
            "⚙️ 代码" \
            "• 新增 yolo_exporter、splitter、augmenter 模块" \
            "• 新增 processing_panel UI" \
            "• 新增 test_data_pipeline、test_export_all 测试" \
            > release-notes.md

          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "PasteLabel $TAG" \
            --notes-file release-notes.md
          for f in staging/*; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
