name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            display: Windows
          - os: ubuntu-latest
            display: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install -r requirements.txt Pillow

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm

      - name: Build with PyInstaller (Linux, Docker ubuntu:18.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              apt-get install -y -qq curl fontconfig binutils \
                libxcb-cursor0 libxkbcommon-x11-0 libegl1-mesa
              apt-get install -y -qq upx-ucl 2>/dev/null || true

              curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
              bash /tmp/miniforge.sh -b -p /opt/conda
              /opt/conda/bin/conda install -y python=3.12 pyqt
              /opt/conda/bin/python -m pip install -q pyinstaller pillow

              /opt/conda/bin/python -m PyInstaller pastelabel/PasteLabel.spec --noconfirm
            "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasteLabel-${{ matrix.display }}
          path: dist/PasteLabel*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF" ] && TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts for upload
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p staging
          if [ -f artifacts/PasteLabel-Windows/PasteLabel.exe ]; then
            cp artifacts/PasteLabel-Windows/PasteLabel.exe "staging/PasteLabel-${TAG}-Windows.exe"
          fi
          if [ -f artifacts/PasteLabel-Linux/PasteLabel ]; then
            file artifacts/PasteLabel-Linux/PasteLabel
            cp artifacts/PasteLabel-Linux/PasteLabel "staging/PasteLabel-${TAG}-Linux"
            chmod +x "staging/PasteLabel-${TAG}-Linux"
            file "staging/PasteLabel-${TAG}-Linux"
          fi

      - name: Create or upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          printf '%s\n' \
            "PasteLabel v1.1.3 — 数据处理稳定性与导出修复" \
            "" \
            "🐛 修复" \
            "• 数据增强框裁剪：平移/缩放后超出图边的检测框裁剪到图内，丢弃退化框" \
            "• YOLO 导出框校验：写前 clip 到图内，丢弃零面积框，避免无效标注" \
            "• classes.txt 幂等：读入已有类别只追加不重排，保持数据集划分一致性" \
            "• 划分清空：每次运行划分前清空输出目录，dataset.yaml 写入正确 path/nc/names" \
            "• 增广范围修复：中点值 (vmin+vmax)/2 改为 random.uniform(vmin, vmax)，保证随机多样性" \
            "• 增广跳过空标签：新增复选框允许用户选择跳过无标注图片（默认勾选）" \
            "• 线程安全：QThread Worker 生命周期修复，closeEvent 正确清理，关窗守卫判 worker 运行态" \
            "• 按钮启用修复：数据处理完成后正确恢复全部 4 个操作按钮" \
            "• 标签扫描回退：从 _path_edit 目录扫描，不依赖 _editor.background_images" \
            "• 移除 500 文件硬上限：大数据集不再被截断" \
            "• dwm 黑色主题：PowerShell 回退中 {/} 转义修复，导出 exe 标题栏同步黑色主题" \
            "• ffi.dll 路径：从 _root/../Library/bin/ffi.dll 改为 sys.prefix/Library/bin/ffi.dll" \
            "• numpy 排除：构建不再打包 numpy，减小 exe 体积" \
            "• requirements.txt：PyQt5>=5.15、pyinstaller>=6.0" \
            > release-notes.md

          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "PasteLabel $TAG" \
            --notes-file release-notes.md
          for f in staging/*; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
